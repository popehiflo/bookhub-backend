version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: bookhub_db
    restart: always
    environment:
      # Credenciales de la BD tomados del archivo .env.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # El puerto del HOST (tu máquina) se define en el archivo .env.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Esto asegura que tus datos persistan incluso si eliminas el contenedor
      - bookhub-postgres-data:/var/lib/postgresql/data

volumes:
  bookhub-postgres-data:
    driver: local