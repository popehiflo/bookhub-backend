# Configuración para una base de datos en memoria (H2) para los tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crear y eliminar el schema automáticamente para cada ejecución de tests.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway no es necesario para los tests con H2 y ddl-auto=create-drop.
spring.flyway.enabled=false
