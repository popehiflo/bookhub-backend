# ===============================================
# = CONFIGURACIÓN DE DATASOURCE (PROD) =
# ===============================================
# La URL, usuario y contraseña se deben proporcionar como variables de entorno en el servidor.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

# ===============================================
# = CONFIGURACIÓN DE JPA/HIBERNATE (PROD) =
# ===============================================
# Valida que el schema de la BD coincida con las entidades al iniciar (validate). No modifica el schema.
spring.jpa.hibernate.ddl-auto=none
# No mostrar las consultas SQL en los logs de producción.
spring.jpa.show-sql=false

# ===============================================
# = CONFIGURACIÓN DE FLYWAY (PROD) =
# ===============================================
# Flyway se deshabilita en el entorno de producción.
spring.flyway.enabled=false
