# ===============================================
# = CONFIGURACIÓN DE DATASOURCE (DEV) =
# ===============================================
# URL de conexión a la base de datos PostgreSQL. El schema 'dbo' se especifica aquí.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=dbo
# Usuario y contraseña para la conexión a la base de datos. Leídos desde variables de entorno.
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Driver de la base de datos.
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# = CONFIGURACIÓN DE JPA/HIBERNATE =
# ===============================================
# Desactiva la creación/modificación automática de tablas por parte de Hibernate. Flyway se encarga de esto.
spring.jpa.hibernate.ddl-auto=none
# Define el dialecto de PostgreSQL para que Hibernate genere SQL optimizado.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Le dice a Hibernate que todas las entidades @Entity por defecto pertenecen al schema 'dbo'.
spring.jpa.properties.hibernate.default_schema=dbo
# Muestra las sentencias SQL generadas por Hibernate en la consola (útil para depuración).
spring.jpa.show-sql=true

# ===============================================
# = CONFIGURACIÓN DE FLYWAY =
# ===============================================
# Habilita Flyway.
spring.flyway.enabled=true
# Especifica a Flyway cuál schema debe administrar.
spring.flyway.schemas=dbo